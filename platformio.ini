; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
; Chave compartilhada exigida pelo servidor (DEVICE_API_KEY). Para ativar,
; acrescente em build_flags:  -DDEVICE_API_KEY='"sua-chave"'   (não commite o segredo)
; Versões de biblioteca fixas: uma atualização automática do ArduinoJson muda o
; modelo de memória (v7) e quebra o firmware silenciosamente.
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
; OTA: duas partições app de ~1,94 MB (0x1F0000) cada, sem SPIFFS.
; O firmware atual usa ~1,46 MB, então cabe com folga para o código de update.
board_build.partitions = ota_nofs_4MB.csv
lib_deps =
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^6.21.5
    adafruit/Adafruit AHTX0@^2.0.6
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1